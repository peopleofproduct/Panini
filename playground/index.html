<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panini Playground — deterministic Indian bank narration parser</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --fg: #e6edf3;
        --muted: #8b949e;
        --accent: #f97316;
        --good: #3fb950;
        --chip: #21262d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 4px;
      }
      h1 .accent {
        color: var(--accent);
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .row > * {
        flex: 1;
        min-width: 180px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      textarea,
      select {
        width: 100%;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      textarea {
        min-height: 64px;
        resize: vertical;
      }
      button {
        background: var(--accent);
        color: #0d1117;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
      }
      .samples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .samples button {
        background: var(--chip);
        color: var(--fg);
        border: 1px solid var(--border);
        font-weight: 400;
        font-size: 12px;
        padding: 5px 10px;
      }
      .samples button:hover {
        border-color: var(--accent);
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .stat {
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 4px 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .stat b {
        color: var(--fg);
        font-weight: 600;
      }
      .stat.good b {
        color: var(--good);
      }
      pre {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 14px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px;
        line-height: 1.55;
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .err {
        color: #f85149;
      }
      footer {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        margin-top: 32px;
      }
      footer a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Panini <span class="accent">Playground</span></h1>
      <p class="sub">
        Deterministic normalization of Indian bank narration strings &amp; SMS — zero dependencies,
        runs entirely in your browser. Nothing leaves this page.
      </p>

      <div class="card">
        <div class="row">
          <div style="flex: 3">
            <label for="input">Narration / SMS</label>
            <textarea
              id="input"
              placeholder="UPI/20261015/DR/826384910234/SWIGGY@okaxis/Cooking/"
            ></textarea>
          </div>
        </div>
        <div class="row">
          <div>
            <label for="bank">Bank hint (optional)</label>
            <select id="bank">
              <option value="">Auto-detect</option>
              <option>SBI</option>
              <option>HDFC</option>
              <option>ICICI</option>
              <option>AXIS</option>
              <option>KOTAK</option>
              <option>BOB</option>
              <option>PNB</option>
              <option>CANARA</option>
              <option>UNION</option>
              <option>FEDERAL</option>
              <option>IDFC</option>
              <option>YES</option>
              <option>INDUSIND</option>
              <option>RBL</option>
            </select>
          </div>
          <div>
            <label for="source">Input medium</label>
            <select id="source">
              <option value="auto">Auto</option>
              <option value="narration">Narration</option>
              <option value="sms">SMS</option>
            </select>
          </div>
          <div style="display: flex; align-items: flex-end; flex: 0.6">
            <button id="parse" style="width: 100%">Parse →</button>
          </div>
        </div>
        <label>Try a sample</label>
        <div class="samples" id="samples"></div>
      </div>

      <div class="card">
        <div class="stats" id="stats"></div>
        <pre id="out">// normalized output appears here</pre>
      </div>

      <footer>
        <a href="https://github.com/peopleofproduct/Panini">github.com/peopleofproduct/Panini</a>
        · Apache-2.0 · People of Product™
      </footer>
    </main>

    <script src="panini-web.js"></script>
    <script>
      const SAMPLES = [
        'UPI/20261015/DR/826384910234/SWIGGY@okaxis/Cooking/',
        'UPI/20261015/CR/987654321098/JANE@wasbi/GIFT/',
        'UPI/P2M/123456789012/JOHN DOE@axisb/DR',
        'IMPS-628491047-ZEPTO-HDFC-INBOUND',
        'IMPS/123456789012/BIGBASKET/OUT',
        'NEFT-N3452618902-SALARY-OCTOBER 2026-TCS LTD',
        'NEFT Cr-SBIN0000123-ACME CORP PVT LTD',
        'BY TRANSFER-NEFT*HDFC0000240*ACME CORP-SALARY',
        'RTGS-YESB0001234-VENDOR PAYMENTS LLP',
        'PAYTM-ZOMATO-123456789012',
        'GPAY-LOCAL KIRANA STORE-778899',
        'POS 4567 DMART BANERJEE',
        'ATW-AXIS ATM TAMBARAM-4567',
        'CHQ PAID-000123-VENDOR NAME',
        'UPIAUTOPAY-NETFLIX-REF123456',
        'AMB CHG-JUL26-CRNBR123',
        'BBPS-BESCOM-999888777',
        'REFUND-FLIPKART-ORD998877',
        'DISB-LN789456123-HDFC LTD',
        'PENSION-EPFO-SEP2026',
        'A/c XX1234 debited by Rs.1,250.00 on 15-10-26 at AMAZON.IN Avl Bal Rs.45,678.90',
        'INR 5000.00 credited to A/c XX7890 on 20261015 by NEFT salary',
        'completely unparseable narration ??? ~~~',
      ];

      const $ = (id) => document.getElementById(id);
      const out = $('out');
      const stats = $('stats');

      for (const s of SAMPLES) {
        const b = document.createElement('button');
        b.textContent = s.length > 44 ? s.slice(0, 41) + '…' : s;
        b.title = s;
        b.onclick = () => {
          $('input').value = s;
          run();
        };
        $('samples').appendChild(b);
      }

      function pill(label, value, good) {
        const d = document.createElement('div');
        d.className = 'stat' + (good ? ' good' : '');
        d.innerHTML = label + ' <b>' + value + '</b>';
        stats.appendChild(d);
      }

      function run() {
        const text = $('input').value;
        const bank = $('bank').value;
        const source = $('source').value;
        stats.innerHTML = '';
        let res;
        try {
          res = window.paniniParse(text, bank, source === 'auto' ? undefined : source);
        } catch (e) {
          out.innerHTML = '<span class="err">' + String(e) + '</span>';
          return;
        }
        pill('channel', res.channel, res.channel !== 'UNKNOWN');
        pill('type', res.type, res.type !== 'UNKNOWN');
        pill('category', res.category, res.category !== 'Uncategorized');
        pill('confidence', (res.confidence * 100).toFixed(0) + '%', res.confidence > 0);
        pill('rule', res.matched_rule || 'none', res.matched_rule !== null);
        out.textContent = JSON.stringify(res, null, 2);
      }

      $('parse').onclick = run;
      $('input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run();
      });
    </script>
  </body>
</html>
