<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="t d"><title id="t">Where Panini sits in India's open-finance stack</title><desc id="d">Data sources (bank statements, payslips, ITR-V and Form 26AS, bank SMS, Account Aggregator data) flow as raw inconsistent formats into Panini, an open-source normalization layer with extraction, integrity forensics, a narration grammar engine, and insights and fraud indicators. Panini outputs clean typed data with evidence to lenders, expense apps, reconciliation engines, FIUs and audit teams, who contribute grammar back.</desc><defs><marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arr-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="arr-saffron" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker><marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A" text-anchor="start">Where Panini sits in India's open-finance stack</text><text x="60" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">An open-source normalization layer between raw financial documents and the systems that use them.</text><rect x="40" y="120" width="1200" height="520" rx="14" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="60" y="106" width="640" height="28" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/><text x="78" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1">OPERATES WITHIN</text><text x="222" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#B45309" text-anchor="start">RBI  ·  Sahamati (AA framework)  ·  NPCI (UPI)  ·  DPDP Act, 2023</text><text x="80" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.2">DATA SOURCES</text><text x="960" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.2">CONSUMERS</text><rect x="80" y="186" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="80" y="186" width="4" height="62" rx="2" fill="#64748B"/><text x="100" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Bank statements</text><text x="100" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">PDF · CSV · XLSX</text><path d="M340,217 L356,217" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="264" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="80" y="264" width="4" height="62" rx="2" fill="#64748B"/><text x="100" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Payslips</text><text x="100" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">many employer formats</text><path d="M340,295 L356,295" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="342" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="80" y="342" width="4" height="62" rx="2" fill="#64748B"/><text x="100" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">ITR-V &amp; Form 26AS</text><text x="100" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">income-tax documents</text><path d="M340,373 L356,373" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="420" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="80" y="420" width="4" height="62" rx="2" fill="#64748B"/><text x="100" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Bank SMS</text><text x="100" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">transaction alerts</text><path d="M340,451 L356,451" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="498" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="80" y="498" width="4" height="62" rx="2" fill="#64748B"/><text x="100" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Account Aggregator data</text><text x="100" y="544" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">consented FI payloads</text><path d="M340,529 L356,529" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="186" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="1216" y="186" width="4" height="62" rx="2" fill="#10B981"/><text x="980" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Lenders &amp; NBFCs</text><text x="980" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">underwriting</text><path d="M944,217 L960,217" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="264" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="1216" y="264" width="4" height="62" rx="2" fill="#10B981"/><text x="980" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Expense &amp; PFM apps</text><text x="980" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">categorisation</text><path d="M944,295 L960,295" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="342" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="1216" y="342" width="4" height="62" rx="2" fill="#10B981"/><text x="980" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Reconciliation engines</text><text x="980" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">matching &amp; ledgers</text><path d="M944,373 L960,373" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="420" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="1216" y="420" width="4" height="62" rx="2" fill="#10B981"/><text x="980" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">FIUs on the AA network</text><text x="980" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">consented data use</text><path d="M944,451 L960,451" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="498" width="260" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="1216" y="498" width="4" height="62" rx="2" fill="#10B981"/><text x="980" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Audit &amp; compliance</text><text x="980" y="544" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">evidence trails</text><path d="M944,529 L960,529" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M356,217 L356,529" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M944,217 L944,529" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M356,373 L474,373" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-slate)"/><text x="415" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">raw, inconsistent</text><text x="415" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">formats</text><path d="M800,373 L940,373" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/><text x="872" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">clean typed data</text><text x="872" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">+ evidence</text><rect x="480" y="200" width="320" height="310" rx="12" fill="#4F46E5" filter="url(#shadow)"/><text x="640" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Panini</text><text x="640" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.85">open-source normalization layer</text><rect x="500" y="296" width="280" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.13"/><text x="518" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start" fill-opacity="0.7">01</text><text x="548" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Extraction</text><rect x="500" y="346" width="280" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.13"/><text x="518" y="373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start" fill-opacity="0.7">02</text><text x="548" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Integrity forensics</text><rect x="500" y="396" width="280" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.13"/><text x="518" y="423" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start" fill-opacity="0.7">03</text><text x="548" y="423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Narration grammar engine</text><rect x="500" y="446" width="280" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.13"/><text x="518" y="473" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start" fill-opacity="0.7">04</text><text x="548" y="473" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Insights &amp; fraud indicators</text><rect x="510" y="524" width="260" height="30" rx="15" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/><text x="640" y="544" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4338CA" text-anchor="middle">Apache-2.0  ·  runs in your process</text><path d="M1090,560 L1090,600 L640,600 L640,562" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arr-green)"/><text x="865" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#047857" text-anchor="middle" font-style="italic">community grammar contributions</text><text x="640.0" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" font-style="italic">Public infrastructure for the data layer — like UPI, one level down.</text></svg>