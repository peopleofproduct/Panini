<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="t d"><title id="t">Before and after Panini</title><desc id="d">Today: five companies (a lender, a fintech, an expense app, a reconciliation engine and an FIU) each send data to per-report vendor APIs, paying per report, with data leaving their systems, flags they can't audit, and the same fix bought repeatedly. With Panini: each company runs Panini in-process on top of a shared community grammar corpus, so fixes propagate to everyone, cost nothing per report, data never moves, and every flag has evidence rows.</desc><defs><marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arr-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker><marker id="arr-saffron" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker><marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A" text-anchor="start">Before and after Panini</text><text x="40" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Every fintech needs the same normalization layer. Today it is bought per report or rebuilt in-house.</text><text x="50" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="start" letter-spacing="1.2">TODAY</text><rect x="50" y="152" width="100" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="100" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Lender A</text><rect x="165" y="152" width="100" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="215" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Fintech B</text><rect x="280" y="152" width="100" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="330" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Expense app</text><rect x="395" y="152" width="100" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="445" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Recon engine</text><rect x="510" y="152" width="100" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="560" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">FIU</text><path d="M100,208 L250.0,292" fill="none" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/><path d="M215,208 L290.0,292" fill="none" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/><path d="M330,208 L330.0,292" fill="none" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/><path d="M445,208 L370.0,292" fill="none" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/><path d="M560,208 L410.0,292" fill="none" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/><rect x="220" y="296" width="220" height="84" rx="8" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/><text x="330.0" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Per-report vendor APIs</text><text x="330.0" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.6">black box</text><circle cx="54" cy="431" r="4" fill="#EF4444"/><text x="68" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">₹ per report</text><circle cx="344" cy="431" r="4" fill="#EF4444"/><text x="358" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Data leaves your system</text><circle cx="54" cy="465" r="4" fill="#EF4444"/><text x="68" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Can't audit the flags</text><circle cx="344" cy="465" r="4" fill="#EF4444"/><text x="358" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Same fix re-bought by everyone</text><rect x="50" y="518" width="560" height="40" rx="8" fill="#F1F5F9" fill-opacity="0.7"/><text x="330" y="543" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle" font-style="italic">…or private regex spaghetti, rebuilt N times</text><path d="M640,120 L640,580" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="670" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="start" letter-spacing="1.2">WITH PANINI</text><rect x="670" y="152" width="100" height="104" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="720" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Lender A</text><rect x="680" y="196" width="80" height="46" rx="6" fill="#4F46E5"/><text x="720" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Panini</text><text x="720" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.8">in-process</text><path d="M720,294 L720,262" fill="none" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#arr-green)"/><rect x="785" y="152" width="100" height="104" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="835" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Fintech B</text><rect x="795" y="196" width="80" height="46" rx="6" fill="#4F46E5"/><text x="835" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Panini</text><text x="835" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.8">in-process</text><path d="M835,294 L835,262" fill="none" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#arr-green)"/><rect x="900" y="152" width="100" height="104" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="950" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Expense app</text><rect x="910" y="196" width="80" height="46" rx="6" fill="#4F46E5"/><text x="950" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Panini</text><text x="950" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.8">in-process</text><path d="M950,294 L950,262" fill="none" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#arr-green)"/><rect x="1015" y="152" width="100" height="104" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="1065" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Recon engine</text><rect x="1025" y="196" width="80" height="46" rx="6" fill="#4F46E5"/><text x="1065" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Panini</text><text x="1065" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.8">in-process</text><path d="M1065,294 L1065,262" fill="none" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#arr-green)"/><rect x="1130" y="152" width="100" height="104" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="1180" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">FIU</text><rect x="1140" y="196" width="80" height="46" rx="6" fill="#4F46E5"/><text x="1180" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Panini</text><text x="1180" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.8">in-process</text><path d="M1180,294 L1180,262" fill="none" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#arr-green)"/><rect x="670" y="296" width="560" height="84" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><text x="950" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">community grammar corpus</text><text x="950" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">fixes propagate to everyone</text><circle cx="674" cy="431" r="4" fill="#10B981"/><text x="688" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">₹0 per report</text><circle cx="964" cy="431" r="4" fill="#10B981"/><text x="978" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Data never moves</text><circle cx="674" cy="465" r="4" fill="#10B981"/><text x="688" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">Every flag has evidence rows</text><circle cx="964" cy="465" r="4" fill="#10B981"/><text x="978" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">One fix benefits all</text><text x="640.0" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" font-style="italic">Infrastructure everyone needs, differentiated by no one — that's a commons, not a product.</text></svg>