nt-weight="700" fill="#0F172A" text-anchor="start">Classify</text><text x="466" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#4338CA" text-anchor="start">rules-engine</text><path d="M466,206 L610,206" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="466" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Narration grammar</text><text x="466" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">→ channel · merchant</text><text x="466" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">→ VPA · category</text><path d="M630,220 L650,220" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-indigo)"/><rect x="652" y="120" width="180" height="200" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="678" cy="150" r="13" fill="#4F46E5"/><text x="678" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="700" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Analyse</text><text x="670" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#4338CA" text-anchor="start">insights</text><path d="M670,206 L814,206" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="670" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Income · FOIR</text><text x="670" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Fraud indicators</text><text x="670" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Multi-account view</text><path d="M834,220 L854,220" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-indigo)"/><rect x="856" y="120" width="180" height="200" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="882" cy="150" r="13" fill="#4F46E5"/><text x="882" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="904" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Validate</text><text x="874" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#4338CA" text-anchor="start">standards-schema</text><path d="M874,206 L1018,206" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="874" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">AA · ONDC · OCEN</text><text x="874" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI',