ace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#4338CA" text-anchor="start">panini-py</text><text x="963" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Python package, same outputs</text><rect x="40" y="480" width="1200" height="86" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/><text x="64" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4338CA" text-anchor="start">Every claim carries a rule_id and evidence indices</text><text x="64" y="544" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">income_detected: ₹85,000/month  →  rule: PANINI-INC-001  →  evidence: [txn 12, 31, 58]</text><text x="1216" y="544" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="end" font-style="italic">illustrative values</text><text x="640.0" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" font-style="italic">Deterministic. Offline-capable. Auditable.</text></svg>