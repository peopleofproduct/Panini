[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panini-parser"
version = "0.1.0"
description = "Deterministic, privacy-preserving parser for Indian bank narrations — Python port of @panini/rules-engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "People of Product" }]
keywords = ["india", "fintech", "bank-statement", "upi", "neft", "imps", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/peopleofproduct/Panini"
Repository = "https://github.com/peopleofproduct/Panini"

[tool.setuptools]
packages = ["panini"]
