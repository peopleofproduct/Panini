name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run bench:ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python port — corpus conformance
        working-directory: panini-py
        run: python -m unittest discover tests
